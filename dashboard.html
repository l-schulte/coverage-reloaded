<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CoverageReloaded Dashboard</title>
<style>
  :root {
    --bg: #0d1117;
    --card: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --text-muted: #8b949e;
    --green: #3fb950;
    --red: #f85149;
    --orange: #d29922;
    --blue: #58a6ff;
    --gray: #484f58;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; background: var(--bg); color: var(--text); padding: 20px; }
  h1 { font-size: 24px; margin-bottom: 4px; }
  .subtitle { color: var(--text-muted); font-size: 14px; margin-bottom: 20px; }
  .summary-bar { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 24px; }
  .summary-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 12px 18px; min-width: 120px; }
  .summary-card .num { font-size: 28px; font-weight: 600; }
  .summary-card .label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px; }
  .project { background: var(--card); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 12px; overflow: hidden; }
  .project-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; cursor: pointer; user-select: none; }
  .project-header:hover { background: rgba(255,255,255,.03); }
  .project-name { font-size: 16px; font-weight: 600; }
  .project-stats { display: flex; gap: 16px; font-size: 13px; }
  .project-stats .pass { color: var(--green); }
  .project-stats .fail { color: var(--red); }
  .project-stats .error { color: var(--orange); }
  .project-stats .total { color: var(--text-muted); }
  .project-body { display: none; border-top: 1px solid var(--border); }
  .project-body.open { display: block; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; padding: 8px 12px; background: rgba(255,255,255,.03); color: var(--text-muted); font-weight: 500; border-bottom: 1px solid var(--border); }
  td { padding: 6px 12px; border-bottom: 1px solid rgba(48,54,61,.4); vertical-align: top; }
  tr:hover td { background: rgba(255,255,255,.02); }
  .suite-name { font-family: 'SF Mono','Fira Code',monospace; font-size: 12px; }
  .badge { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 11px; font-weight: 600; }
  .badge-pass { background: rgba(63,185,80,.15); color: var(--green); }
  .badge-fail { background: rgba(248,81,73,.15); color: var(--red); }
  .badge-error { background: rgba(210,153,34,.15); color: var(--orange); }
  .coverage-bar { display: inline-flex; align-items: center; gap: 6px; }
  .coverage-bar .bar { width: 60px; height: 6px; background: var(--gray); border-radius: 3px; overflow: hidden; display: inline-block; }
  .coverage-bar .bar-fill { height: 100%; border-radius: 3px; }
  .coverage-bar .pct { font-family: 'SF Mono','Fira Code',monospace; font-size: 12px; min-width: 38px; }
  .commit-hash { font-family: 'SF Mono','Fira Code',monospace; font-size: 11px; color: var(--text-muted); }
  .commit-date { font-size: 12px; color: var(--text-muted); white-space: nowrap; }
  .loading { text-align: center; padding: 40px; color: var(--text-muted); }
  .error-msg { text-align: center; padding: 40px; color: var(--red); }
  .arrow { transition: transform .2s; display: inline-block; margin-right: 6px; font-size: 12px; }
  .arrow.open { transform: rotate(90deg); }
  .search-box { margin-bottom: 16px; }
  .search-box input { width: 100%; padding: 8px 12px; background: var(--card); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 14px; outline: none; }
  .search-box input:focus { border-color: var(--blue); }
  .legend { display: flex; gap: 16px; font-size: 12px; color: var(--text-muted); margin-bottom: 16px; }
  .legend span { display: flex; align-items: center; gap: 4px; }
  .legend .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
</style>
</head>
<body>

<h1>📊 CoverageReloaded Dashboard</h1>
<p class="subtitle">Longitudinal coverage across all projects — <span id="last-updated">loading...</span></p>

<div class="search-box">
  <input type="text" id="search" placeholder="Filter projects by name..." oninput="filterProjects()">
</div>

<div class="summary-bar" id="summary-bar"></div>
<div class="legend">
  <span><span class="dot" style="background:var(--green)"></span> All suites passed</span>
  <span><span class="dot" style="background:var(--orange)"></span> Tests failed (coverage collected)</span>
  <span><span class="dot" style="background:var(--red)"></span> No coverage produced</span>
</div>

<div id="dashboard-content" class="loading">Scanning project directories...</div>

<script>
// ── Coverage bar HTML ───────────────────────────────────────────────────────
function coverageBar(pct) {
  if (pct === null || isNaN(pct)) return '<span class="coverage-bar"><span class="pct" style="color:var(--text-muted)">—</span></span>';
  const color = pct >= 80 ? 'var(--green)' : pct >= 50 ? 'var(--orange)' : 'var(--red)';
  return `<span class="coverage-bar"><span class="bar"><span class="bar-fill" style="width:${Math.min(pct,100)}%;background:${color}"></span></span><span class="pct" style="color:${color}">${pct.toFixed(1)}%</span></span>`;
}

// ── Lines covered display (hit / total) ─────────────────────────────────────
function linesCovered(hit, total) {
  if (hit === undefined || total === undefined) return '<span style="color:var(--text-muted)">—</span>';
  return `<span style="font-family:'SF Mono','Fira Code',monospace;font-size:12px;color:var(--text-muted)">${hit.toLocaleString()} / ${total.toLocaleString()}</span>`;
}

// ── In-memory cache for fetched project details ─────────────────────────────
const detailCache = {};

// ── Main ────────────────────────────────────────────────────────────────────
async function loadDashboard() {
  const content = document.getElementById('dashboard-content');
  const lastUpdated = document.getElementById('last-updated');
  lastUpdated.textContent = new Date().toISOString().replace('T', ' ').substring(0, 19);

  try {
    const resp = await fetch('/api/projects');
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const projects = await resp.json();
    renderDashboard(projects);
  } catch (e) {
    content.innerHTML = `<div class="error-msg">Failed to load: ${e.message}</div>`;
  }
}

// ── Render ──────────────────────────────────────────────────────────────────
function renderDashboard(projects) {
  const content = document.getElementById('dashboard-content');
  const summaryBar = document.getElementById('summary-bar');

  let totalCommits = 0, totalPassed = 0, totalFailed = 0, totalErrors = 0;
  for (const p of projects) {
    totalCommits += p.totalCommits || 0;
    totalPassed += p.passed || 0;
    totalFailed += p.failed || 0;
    totalErrors += p.errors || 0;
  }

  summaryBar.innerHTML = `
    <div class="summary-card"><div class="num">${projects.length}</div><div class="label">Projects</div></div>
    <div class="summary-card"><div class="num">${totalCommits}</div><div class="label">Commits</div></div>
    <div class="summary-card"><div class="num" style="color:var(--green)">${totalPassed}</div><div class="label">Passed</div></div>
    <div class="summary-card"><div class="num" style="color:var(--orange)">${totalFailed}</div><div class="label">Failed</div></div>
    <div class="summary-card"><div class="num" style="color:var(--red)">${totalErrors}</div><div class="label">No Coverage</div></div>
  `;

  content.innerHTML = projects.map(p => renderProjectSummary(p)).join('');

  document.querySelectorAll('.project-header').forEach(h => {
    h.addEventListener('click', () => {
      const body = h.nextElementSibling;
      const arrow = h.querySelector('.arrow');
      const isOpen = body.classList.toggle('open');
      arrow.classList.toggle('open');
      if (isOpen && !body.dataset.loaded) {
        loadProjectDetail(h.dataset.name, body);
      }
    });
  });
}

function renderProjectSummary(p) {
  return `
    <div class="project" data-project="${p.name.toLowerCase()}">
      <div class="project-header" data-name="${p.name}">
        <div>
          <span class="arrow">▶</span>
          <span class="project-name">${p.name}</span>
        </div>
        <div class="project-stats">
          <span class="pass">✓ ${p.passed}</span>
          <span class="fail" style="color:var(--orange)">✗ ${p.failed}</span>
          <span class="error" style="color:var(--red)">⚠ ${p.errors}</span>
          <span class="total">${p.totalCommits} total</span>
        </div>
      </div>
      <div class="project-body"></div>
    </div>
  `;
}

async function loadProjectDetail(name, bodyEl) {
  bodyEl.dataset.loaded = '1';
  bodyEl.innerHTML = '<div class="loading">Loading commits...</div>';
  try {
    if (detailCache[name]) {
      renderProjectBody(name, detailCache[name], bodyEl);
      return;
    }
    const resp = await fetch(`/api/project/${encodeURIComponent(name)}`);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const data = await resp.json();
    detailCache[name] = data;
    renderProjectBody(name, data, bodyEl);
  } catch (e) {
    bodyEl.innerHTML = `<div class="error-msg">Failed to load: ${e.message}</div>`;
  }
}

function renderProjectBody(name, p, bodyEl) {
  bodyEl.innerHTML = `
    <table>
      <thead>
        <tr>
          <th>Commit</th>
          <th>Date</th>
          <th>Suite</th>
          <th>Exit</th>
          <th>Lines %</th>
          <th>Lines Cov'd</th>
          <th>Functions</th>
          <th>Branches</th>
          <th>Log</th>
          <th>Git</th>
        </tr>
      </thead>
      <tbody>
        ${p.commits.map(c => renderCommit(c, p.repoUrl)).join('')}
      </tbody>
    </table>
  `;
}

function renderCommit(c, repoUrl) {
  c.repoUrl = repoUrl;
  if (c.status === 'error') {
    return `
      <tr>
        <td class="commit-hash">${c.hash.length > 16 ? c.hash.substring(0,16)+'…' : c.hash}</td>
        <td class="commit-date">${c.date}</td>
        <td colspan="6"><span class="badge badge-error" style="background:rgba(248,81,73,.15);color:var(--red)">ERROR — no coverage produced</span></td>
        <td>${logLink(c.logUrl)}</td>
        <td>${ghLink(c.hash, c.repoUrl)}</td>
      </tr>`;
  }

  if (c.suites.length === 0) {
    return `
      <tr>
        <td class="commit-hash">${c.prefix.length > 16 ? c.prefix.substring(0,16)+'…' : c.prefix}</td>
        <td class="commit-date">${c.date}</td>
        <td colspan="6"><span class="badge badge-error">No suites</span></td>
        <td>${logLink(c.logUrl)}</td>
        <td>${ghLink(c.hash, c.repoUrl)}</td>
      </tr>`;
  }

  const first = c.suites[0];
  const rows = [];

  rows.push(`
    <tr>
      <td class="commit-hash" rowspan="${c.suites.length}">${c.prefix.length > 16 ? c.prefix.substring(0,16)+'…' : c.prefix}</td>
      <td class="commit-date" rowspan="${c.suites.length}">${c.date}</td>
      <td class="suite-name">${escHtml(first.name)}</td>
      <td>${first.exitCode !== null ? exitBadge(first.exitCode) : '<span class="badge badge-error">—</span>'}</td>
      <td>${first.coverage ? coverageBar(first.coverage.lines.pct) : '<span class="pct" style="color:var(--text-muted)">—</span>'}</td>
      <td>${first.coverage ? linesCovered(first.coverage.lines.hit, first.coverage.lines.total) : '<span style="color:var(--text-muted)">—</span>'}</td>
      <td>${first.coverage ? coverageBar(first.coverage.functions.pct) : '<span class="pct" style="color:var(--text-muted)">—</span>'}</td>
      <td>${first.coverage ? coverageBar(first.coverage.branches.pct) : '<span class="pct" style="color:var(--text-muted)">—</span>'}</td>
      <td class="commit-date" rowspan="${c.suites.length}">${logLink(c.logUrl)}</td>
      <td class="commit-date" rowspan="${c.suites.length}">${ghLink(c.hash, c.repoUrl)}</td>
    </tr>`);

  for (let i = 1; i < c.suites.length; i++) {
    const s = c.suites[i];
    rows.push(`
      <tr>
        <td class="suite-name">${escHtml(s.name)}</td>
        <td>${s.exitCode !== null ? exitBadge(s.exitCode) : '<span class="badge badge-error">—</span>'}</td>
        <td>${s.coverage ? coverageBar(s.coverage.lines.pct) : '<span class="pct" style="color:var(--text-muted)">—</span>'}</td>
        <td>${s.coverage ? linesCovered(s.coverage.lines.hit, s.coverage.lines.total) : '<span style="color:var(--text-muted)">—</span>'}</td>
        <td>${s.coverage ? coverageBar(s.coverage.functions.pct) : '<span class="pct" style="color:var(--text-muted)">—</span>'}</td>
        <td>${s.coverage ? coverageBar(s.coverage.branches.pct) : '<span class="pct" style="color:var(--text-muted)">—</span>'}</td>
      </tr>`);
  }

  return rows.join('');
}

function exitBadge(code) {
  if (code === 0) return '<span class="badge badge-pass">0</span>';
  return `<span class="badge" style="background:rgba(210,153,34,.15);color:var(--orange)">${code}</span>`;
}

function logLink(url) {
  if (!url) return '<span class="pct" style="color:var(--text-muted)">—</span>';
  return `<a href="${url}" target="_blank" style="color:var(--blue);text-decoration:none;font-size:12px;" title="View log">📋 log</a>`;
}

function ghLink(hash, repoUrl) {
  if (!repoUrl) return '<span class="pct" style="color:var(--text-muted)">—</span>';
  const parts = hash.split('_');
  const commitHash = parts[parts.length - 1];
  const url = `${repoUrl}/tree/${commitHash}`;
  return `<a href="${url}" target="_blank" style="color:var(--blue);text-decoration:none;font-size:12px;" title="View commit on GitHub">🔗 git</a>`;
}

function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function filterProjects() {
  const q = document.getElementById('search').value.toLowerCase();
  document.querySelectorAll('.project').forEach(el => {
    el.style.display = el.dataset.project.includes(q) ? '' : 'none';
  });
}

loadDashboard();
</script>
</body>
</html>
